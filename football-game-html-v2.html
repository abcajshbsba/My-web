<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 足球预测小游戏 - HTML单文件版</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#07111f;color:#fff;min-height:100vh}header{background:linear-gradient(135deg,#0d6efd,#14532d);padding:18px 15px;box-shadow:0 4px 20px #0005}.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800}.userbar{display:flex;align-items:center;gap:10px}.logout{border:0;border-radius:20px;padding:8px 13px;cursor:pointer;background:#ffffff22;color:#fff}.container{max-width:1100px;margin:24px auto;padding:0 15px}.panel{background:#111d2d;border:1px solid #223149;border-radius:16px;padding:20px;box-shadow:0 8px 30px #0003}.auth-panel{max-width:480px;margin:50px auto}.auth-panel h1{margin-top:0}.muted{color:#94a3b8}.tabs{display:flex;gap:8px;margin:20px 0}.tab{flex:1;padding:12px;border:0;border-radius:9px;background:#172235;color:#cbd5e1;cursor:pointer}.tab.active{background:#16a34a;color:#fff}.auth-panel input,.bet-input{width:100%;padding:13px;margin:7px 0;background:#08111e;border:1px solid #334155;border-radius:9px;color:#fff;outline:0}.primary{width:100%;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.message{min-height:24px;color:#f87171;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#111d2d;border:1px solid #223149;border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:8px}.stat span{color:#94a3b8;font-size:14px}.stat b{font-size:25px}.notice{background:#111d2d;border-left:4px solid #22c55e;padding:14px;border-radius:8px;color:#cbd5e1;margin-bottom:22px}h2{margin:22px 0 14px}.matches{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.match{background:#111d2d;border:1px solid #223149;border-radius:16px;padding:18px}.match-top{display:flex;justify-content:space-between;color:#94a3b8;font-size:13px}.league{color:#22c55e;font-weight:bold}.teams{display:flex;justify-content:space-between;align-items:center;text-align:center;margin:18px 0}.team{width:40%}.team-icon{font-size:40px}.team-name{font-weight:bold;margin-top:7px}.vs{color:#64748b;font-weight:800}.odds,.predictions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.odd{background:#0b1625;border-radius:8px;padding:9px;text-align:center;color:#facc15}.pred{padding:11px;border:1px solid #334155;background:#172235;color:#fff;border-radius:8px;cursor:pointer}.pred.selected{background:#16a34a;border-color:#22c55e}.betrow{display:flex;gap:8px;margin-top:10px}.betrow .bet-input{margin:0}.confirm,.simulate{border:0;border-radius:8px;padding:0 14px;cursor:pointer;font-weight:bold}.confirm{background:#2563eb;color:#fff}.simulate{width:100%;padding:12px;margin-top:10px;background:#f59e0b;color:#111827}.simulate:disabled,.confirm:disabled,.pred:disabled{opacity:.45;cursor:not-allowed}.result{margin-top:10px;background:#0b1625;border-radius:8px;padding:11px;text-align:center;color:#cbd5e1}.win{color:#4ade80}.lose{color:#f87171}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.history-item,.rank-item{padding:12px 0;border-bottom:1px solid #243244;font-size:14px}.rank-item{display:flex;justify-content:space-between}.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 20px;border-radius:30px;display:none;z-index:20}.toast.show{display:block}.danger{background:#dc2626!important}.secondary{background:#334155!important}@media(max-width:700px){.nav{flex-direction:column;gap:10px}.stats{grid-template-columns:repeat(2,1fr)}.matches,.columns{grid-template-columns:1fr}.betrow{flex-direction:column}.confirm{padding:12px}.auth-panel{margin:25px auto}.logo{font-size:21px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">⚽ 足球预测中心</div><div id="accountArea"></div></div></header>
<main class="container">
<section id="loginPanel" class="panel auth-panel">
<h1>⚽ 欢迎来到足球预测中心</h1><p class="muted">纯 HTML 单文件版 · 无需 Node.js · 数据保存在本机浏览器</p>
<div class="tabs"><button id="loginTab" class="tab active">登录</button><button id="registerTab" class="tab">注册</button></div>
<form id="authForm"><input id="username" placeholder="用户名" required><input id="password" type="password" placeholder="密码（至少6位）" required><button class="primary" type="submit" id="authButton">登录</button></form>
<div id="authMessage" class="message"></div>
</section>
<section id="gamePanel" hidden>
<div class="stats"><div class="stat"><span>💰 金币</span><b id="coins">0</b></div><div class="stat"><span>🎯 预测</span><b id="total">0</b></div><div class="stat"><span>✅ 成功</span><b id="wins">0</b></div><div class="stat"><span>📈 胜率</span><b id="rate">0%</b></div></div>
<div class="notice">🎮 本版本完全使用虚拟金币，不涉及充值、提现或真实资金投注。关闭浏览器后数据仍会保存在本机。</div>
<h2>⚽ 今日模拟赛事</h2><div id="matches" class="matches"></div>
<div class="columns"><section class="panel"><h2>📜 我的预测记录</h2><div id="history"></div></section><section class="panel"><h2>🏆 财富排行榜</h2><div id="leaderboard"></div></section></div>
</section></main><div id="toast" class="toast"></div>
<script>
const matches=[
{id:1,league:"欧洲冠军联赛",time:"20:00",home:"曼城",away:"皇马",homeIcon:"🔵",awayIcon:"⚪",odds:[1.80,3.50,2.80]},
{id:2,league:"欧洲冠军联赛",time:"21:00",home:"利物浦",away:"巴塞罗那",homeIcon:"🔴",awayIcon:"🔵",odds:[2.10,3.30,2.40]},
{id:3,league:"英超",time:"22:00",home:"阿森纳",away:"切尔西",homeIcon:"🔴",awayIcon:"🔵",odds:[1.95,3.40,3.10]},
{id:4,league:"西甲",time:"22:30",home:"巴萨",away:"马竞",homeIcon:"🔵",awayIcon:"🔴",odds:[1.75,3.60,3.20]},
{id:5,league:"德甲",time:"23:00",home:"拜仁",away:"多特",homeIcon:"🔴",awayIcon:"🟡",odds:[1.65,3.80,3.60]},
{id:6,league:"意甲",time:"23:30",home:"AC米兰",away:"国际米兰",homeIcon:"🔴",awayIcon:"🔵",odds:[2.70,3.20,2.00]}];
let isRegister=false,currentUser=null,predictions={},locked=new Set();
const $=id=>document.getElementById(id); const key=u=>"football_user_"+u; const usersKey="football_users";
function users(){return JSON.parse(localStorage.getItem(usersKey)||"[]")} function saveUsers(a){localStorage.setItem(usersKey,JSON.stringify(a))}
function getUser(u){return JSON.parse(localStorage.getItem(key(u))||"null")} function saveUser(u){localStorage.setItem(key(u.username),JSON.stringify(u))}
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function predictionText(v){return v==="home"?"主胜":v==="draw"?"平局":"客胜"} function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMatches(){
$("matches").innerHTML=matches.map(m=>`<div class="match" id="match-${m.id}"><div class="match-top"><span class="league">${m.league}</span><span>${m.time}</span></div><div class="teams"><div class="team"><div class="team-icon">${m.homeIcon}</div><div class="team-name">${m.home}</div></div><div class="vs">VS</div><div class="team"><div class="team-icon">${m.awayIcon}</div><div class="team-name">${m.away}</div></div></div><div class="odds"><div class="odd">主胜<br><b>${m.odds[0]}</b></div><div class="odd">平局<br><b>${m.odds[1]}</b></div><div class="odd">客胜<br><b>${m.odds[2]}</b></div></div><p class="muted">请选择预测：</p><div class="predictions"><button class="pred" data-id="${m.id}" data-value="home">主胜</button><button class="pred" data-id="${m.id}" data-value="draw">平局</button><button class="pred" data-id="${m.id}" data-value="away">客胜</button></div><div class="betrow"><input class="bet-input" id="bet-${m.id}" type="number" min="10" step="10" value="100"><button class="confirm" id="confirm-${m.id}">确认预测</button></div><button class="simulate" id="simulate-${m.id}" disabled>🎮 模拟比赛</button><div class="result" id="result-${m.id}">等待你的预测...</div></div>`).join("");
document.querySelectorAll(".pred").forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(locked.has(id))return;predictions[id]=b.dataset.value;$("match-"+id).querySelectorAll(".pred").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});
matches.forEach(m=>{$("confirm-"+m.id).onclick=()=>confirmBet(m.id);$("simulate-"+m.id).onclick=()=>simulate(m.id)})}
function confirmBet(id){if(!predictions[id])return toast("请先选择主胜、平局或客胜");const bet=+$(`bet-${id}`).value;if(!Number.isInteger(bet)||bet<10)return toast("下注至少10金币，且必须为整数");if(bet>currentUser.coins)return toast("金币不足，请减少下注金额");$("bet-"+id).disabled=true;$("confirm-"+id).disabled=true;$("match-"+id).querySelectorAll(".pred").forEach(b=>b.disabled=true);$("simulate-"+id).disabled=false;toast("预测已锁定，可以开始模拟比赛")}
function simulate(id){if(locked.has(id))return;const bet=+$(`bet-${id}`).value;const prediction=predictions[id];const outcomes=["home","draw","away"];const result=outcomes[Math.floor(Math.random()*3)];const score=result==="home"?`${rand(1,4)}-${rand(0,2)}`:result==="away"?`${rand(0,2)}-${rand(1,4)}`:`${rand(0,2)}-${rand(0,2)}`;const win=prediction===result;const m=matches.find(x=>x.id===id);let payout=0;if(win){payout=Math.floor(bet*m.odds[result==="home"?0:result==="draw"?1:2]);currentUser.coins+=payout-bet;currentUser.wins++;}else currentUser.coins-=bet;currentUser.total++;currentUser.history.unshift({match_name:`${m.home} vs ${m.away}`,prediction,result,score,bet,payout,win,time:new Date().toLocaleString()});saveUser(currentUser);locked.add(id);const box=$("result-"+id);box.className="result "+(win?"win":"lose");box.innerHTML=`${win?"🎉 预测正确":"❌ 预测错误"}<br>${m.home} ${score} ${m.away}<br>${win?"返还 +"+payout:"损失 -"+bet} 金币`;$("simulate-"+id).textContent="🏁 比赛已结束";updateUser();loadHistory();loadLeaderboard();toast(win?"恭喜预测成功！":"很遗憾，这次预测失败");}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function updateUser(){const u=currentUser;$("coins").textContent=u.coins;$("total").textContent=u.total;$("wins").textContent=u.wins;$("rate").textContent=u.total?Math.round(u.wins/u.total*100)+"%":"0%";$("accountArea").innerHTML=`<div class="userbar">👤 ${esc(u.username)} <button class="logout" onclick="logout()">退出</button><button class="logout danger" onclick="resetData()">重置</button></div>`}
function loadHistory(){$("history").innerHTML=currentUser.history.length?currentUser.history.map(x=>`<div class="history-item">⚽ ${esc(x.match_name)}<br>预测：<b>${predictionText(x.prediction)}</b>　结果：<b>${predictionText(x.result)}</b>　比分：${x.score}<br>下注 ${x.bet}　${x.win?`<span class="win">✅ +${x.payout}</span>`:`<span class="lose">❌ -${x.bet}</span>`}</div>`).join(""):"<div class='muted'>暂无预测记录</div>"}
function loadLeaderboard(){const list=users().map(u=>getUser(u)).filter(Boolean).sort((a,b)=>b.coins-a.coins);$("leaderboard").innerHTML=list.map((u,i)=>`<div class="rank-item"><span>${i+1}. ${esc(u.username)}</span><b>💰 ${u.coins}</b></div>`).join("")||"<div class='muted'>暂无用户</div>"}
function showGame(){$("loginPanel").hidden=true;$("gamePanel").hidden=false;updateUser();renderMatches();loadHistory();loadLeaderboard()}
function logout(){localStorage.removeItem("football_current_user");location.reload()}
function resetData(){if(!confirm("确定重置当前账号吗？金币和预测记录都会清空。"))return;currentUser={username:currentUser.username,coins:1000,total:0,wins:0,history:[]};saveUser(currentUser);predictions={};locked=new Set();showGame();toast("数据已重置")}
$("loginTab").onclick=()=>{isRegister=false;$("loginTab").classList.add("active");$("registerTab").classList.remove("active");$("authButton").textContent="登录"};$("registerTab").onclick=()=>{isRegister=true;$("registerTab").classList.add("active");$("loginTab").classList.remove("active");$("authButton").textContent="注册"};
$("authForm").onsubmit=e=>{e.preventDefault();const username=$("username").value.trim(),password=$("password").value;if(username.length<2)return $("authMessage").textContent="用户名至少2位";if(password.length<6)return $("authMessage").textContent="密码至少6位";if(isRegister){if(getUser(username))return $("authMessage").textContent="用户名已存在";const u={username,password,coins:1000,total:0,wins:0,history:[]};saveUser(u);if(!users().includes(username)){const a=users();a.push(username);saveUsers(a)}currentUser=u;localStorage.setItem("football_current_user",username);showGame();toast("注册成功，赠送1000金币！")}else{const u=getUser(username);if(!u||u.password!==password)return $("authMessage").textContent="用户名或密码错误";currentUser=u;localStorage.setItem("football_current_user",username);showGame();toast("登录成功！")}};
const saved=localStorage.getItem("football_current_user");if(saved&&getUser(saved)){currentUser=getUser(saved);showGame()}
</script></body></html>
